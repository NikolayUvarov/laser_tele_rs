[package]
name = "laser_tele"
version = "2.1.0"
edition = "2024"
rust-version = "1.88"
description = "Telegram Bot API library with async and blocking API: updates, messages, keyboards, files, polls, inline mode, payments, games, reactions"
license = "Apache-2.0"
repository = "https://github.com/NikolayUvarov/laser_tele_rs"
readme = "README.md"
keywords = ["telegram", "bot", "telegram-bot", "api"]
categories = ["api-bindings", "asynchronous"]

[features]
# SOCKS5 proxies in Config::proxy and HTTPS_PROXY
socks = ["reqwest/socks"]

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "multipart", "rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["full"] }

[[example]]
name = "mtproxy_collector"
test = true
